# Seed documentation and tests.

version: 2

seeds:
  - name: species_crosswalk
    description: >
      Canonical species crosswalk mapping scientific names to a consistent
      species_group identifier across three data sources:
        1. OBIS cetacean sightings (scientific_name / species columns)
        2. Nisi et al. ISDM training data (common name: Humpback, Fin, Blue, Sperm)
        3. NOAA ship strike database (common name: right, finback, humpback, etc.)

      Handles taxonomic uncertainty: genus/family/order-level identifications
      are mapped to appropriate groups (e.g. Balaenoptera genus → unid_rorqual,
      Cetacea order → unid_cetacean).

      Join to stg_cetacean_sightings on scientific_name to get consistent
      species_group labels. Join to Nisi ISDM on nisi_species to bridge
      between datasets.
    columns:
      - name: scientific_name
        description: "Scientific name as it appears in our OBIS sighting data (join key)"
        tests:
          - unique
          - not_null

      - name: common_name
        description: "Human-readable common name"
        tests:
          - not_null

      - name: species_group
        description: >
          Canonical species group identifier used across all models.
          Species-level records get specific groups (e.g. right_whale,
          humpback). Genus/family-level records get 'unid_' prefixed
          groups (e.g. unid_rorqual, unid_cetacean).
        tests:
          - not_null

      - name: nisi_species
        description: >
          Species name as it appears in Nisi et al. ISDM data
          (Humpback, Fin, Blue, Sperm). NULL for species not in Nisi.

      - name: strike_species
        description: >
          Species name as it appears in NOAA ship strike database
          (right, finback, humpback, etc.). NULL for species not in strikes.

      - name: taxonomic_rank
        description: "Taxonomic rank of this entry: species, genus, family, suborder, order"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["species", "genus", "family", "suborder", "order"]

      - name: family
        description: "Taxonomic family (e.g. Balaenopteridae, Delphinidae)"

      - name: is_baleen
        description: "True for Mysticeti (baleen whales): Balaenidae, Balaenopteridae, Eschrichtiidae"
        tests:
          - not_null

      - name: conservation_priority
        description: >
          Relative conservation priority for ship strike risk:
          critical (right whale, vaquita, Rice's whale, Sousa teuszii),
          high (fin, blue, sei, sperm, bowhead, any unidentified baleen),
          moderate (minke, gray, harbor porpoise, orca, beluga, narwhal),
          low (dolphins, beaked whales)
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["critical", "high", "moderate", "low", "unknown"]

      - name: aphia_id
        description: >
          WoRMS (World Register of Marine Species) AphiaID — the
          globally unique taxonomic identifier. Used to generate the
          scientificNameID (LSID) for OBIS Darwin Core exports.
        tests:
          - unique
          - not_null

      - name: worms_lsid
        description: >
          WoRMS Life Science Identifier in the format
          urn:lsid:marinespecies.org:taxname:{aphia_id}. This is the
          scientificNameID field required by OBIS for data publishing.
        tests:
          - unique
          - not_null

  - name: iwc_crosswalk
    description: >
      Machine-readable terminology crosswalk mapping the platform's
      internal terms / field names to the standardised vocabulary of
      the two IWC Scientific Committee guidance papers:
        1. Strike-risk reporting standard (Leaper et al. 2026,
           SC/70/HIM/13) — exposure, encounter rate (R), interactions
           (N), mortality (I), Pleth, Pstrikedepth, avoidance, VTD.
        2. Model-based abundance / SDM guidance (Miller & Kelly 2023,
           SC/69A/ASI/20) — relative occurrence probability vs density
           vs abundance, detectability g(0), uncertainty, extrapolation.

      Each row records our_term, our_field (representative DB/API
      field), the corresponding IWC term, a reference, a definition,
      and notes flagging delivery status (which migration phase ships
      the quantitative version). Served verbatim by
      GET /api/v1/species/iwc-crosswalk for reviewers.
    columns:
      - name: term_id
        description: "Stable slug identifier for the crosswalk entry (join key)"
        tests:
          - unique
          - not_null

      - name: category
        description: >
          Grouping for the term: whale, vessel, exposure, encounter,
          mortality, output, or uncertainty.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - whale
                  - vessel
                  - exposure
                  - encounter
                  - mortality
                  - output
                  - uncertainty

      - name: standard
        description: "Which IWC standard the mapping targets: strike or sdm"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["strike", "sdm"]

      - name: our_term
        description: "Human-readable platform concept name"
        tests:
          - not_null

      - name: our_field
        description: "Representative DB/API field(s) for this concept (may be planned)"
        tests:
          - not_null

      - name: iwc_term
        description: "Standardised IWC term this concept maps to"
        tests:
          - not_null

      - name: iwc_reference
        description: "Source guidance paper / table reference"
        tests:
          - not_null

      - name: definition
        description: "Short definition of the term"
        tests:
          - not_null

      - name: notes
        description: "Caveats and delivery status (which migration phase ships it)"
